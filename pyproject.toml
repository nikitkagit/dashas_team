[project]
name = "task-solver-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openjiuwen",
    "hypothesis>=6.0"
]

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.poetry.group.dev.dependencies]
hypothesis = "^6.0"